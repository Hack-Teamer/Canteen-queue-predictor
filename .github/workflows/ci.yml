name: QueueSense CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff Lint
        working-directory: backend
        run: |
          ruff check app tests

      - name: Run Mypy Type Check
        working-directory: backend
        run: |
          mypy app --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkey1234567890testsecretkey
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
        run: |
          pytest tests -v --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t queuesense-backend:latest -f backend/Dockerfile backend

      - name: Build Vision Docker Image
        run: |
          docker build -t queuesense-vision:latest -f vision/Dockerfile vision
